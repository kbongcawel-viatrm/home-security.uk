[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /fluent-bit/state
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 10M

[INPUT]
    Name              tail
    Tag               wazuh.alerts
    Path              /var/ossec/logs/alerts/alerts.json
    Parser            json
    DB                /fluent-bit/state/wazuh-alerts.db
    Read_from_Head    True
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Tag               suricata.events
    Path              /var/log/suricata/eve.json
    Parser            json
    DB                /fluent-bit/state/suricata-eve.db
    Read_from_Head    True
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[OUTPUT]
    Name              http
    Match             wazuh.alerts
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/wazuh_alerts/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False

[OUTPUT]
    Name              http
    Match             suricata.events
    Host              openobserve
    Port              5080
    URI               /api/${OPENOBSERVE_ORG}/suricata_events/_json
    HTTP_User         ${OPENOBSERVE_USER}
    HTTP_Passwd       ${OPENOBSERVE_PASSWORD}
    Format            json_lines
    Json_date_key     _timestamp
    Json_date_format  iso8601
    tls               Off
    Retry_Limit       False
