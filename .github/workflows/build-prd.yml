permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: prd-security-stack
  cancel-in-progress: false

jobs:
  deploy-prd:
    name: Deploy PRD from image artifacts

    # Use a persistent/self-hosted PRD runner for a real production stack.
    # GitHub-hosted ubuntu-latest runners are destroyed after the job finishes.
    runs-on: [self-hosted, prd]
    environment: prd

    env:
      IMAGE_ARTIFACT_ROOT: ${{ runner.temp }}/artifacts
      COMPOSE_FILE: ${{ github.event.inputs.compose_file || 'security-stack.compose.yml' }}
      SECSTACK_PROFILES: ${{ github.event.inputs.secstack_profiles || 'all' }}
      ENV_FILE: ${{ github.event.inputs.env_file || '.env.prd' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image-sync run ID
        id: image-sync
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_IMAGE_SYNC_RUN_ID: ${{ github.event.inputs.image_sync_run_id }}
          set -euo pipefail

          if [ -n "${INPUT_IMAGE_SYNC_RUN_ID:-}" ]; then
            run_id="${INPUT_IMAGE_SYNC_RUN_ID}"
          else
            run_id="$(gh run list \
              --workflow image-sync.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "Unable to resolve a successful image-sync.yml run ID." >&2
            exit 1
          fi

          echo "Using image-sync.yml run ID: ${run_id}"
          echo "run-id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download all Docker image artifacts from image-sync.yml
        uses: actions/download-artifact@v4
        with:
          pattern: docker-images-*
          path: ${{ runner.temp }}/artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.image-sync.outputs.run-id }}

      - name: Show downloaded artifacts
        run: |
          set -euo pipefail

          echo "Downloaded Docker image artifacts:"
          find "${IMAGE_ARTIFACT_ROOT}" -type f -name "*.tar.gz" -print | sort

      - name: Load Docker images from artifacts
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r artifact; do
            echo "Loading Docker image artifact: ${artifact}"
            gzip -dc "${artifact}" | docker load
            count=$((count + 1))
          done < <(find "${IMAGE_ARTIFACT_ROOT}" -type f -name "*.tar.gz" | sort)

          if [ "${count}" -eq 0 ]; then
            echo "No Docker image artifacts were found under ${IMAGE_ARTIFACT_ROOT}." >&2
            exit 1
          fi

          echo "Loaded ${count} Docker image artifacts."

      - name: Show Docker images after load
        run: |
          docker image ls
          docker system df || true

      - name: Prepare PRD environment file
        run: |
          set -euo pipefail

          if [ -f "${ENV_FILE}" ]; then
            cp "${ENV_FILE}" .env
          elif [ -f ".env.example" ]; then
            echo "WARNING: ${ENV_FILE} was not found. Falling back to .env.example." >&2
            cp .env.example .env
          else
            echo "Neither ${ENV_FILE} nor .env.example exists." >&2
            exit 1
          fi

      - name: Validate Docker Compose config
        run: |
          set -euo pipefail

          compose_args=("-f" "${COMPOSE_FILE}")

          for profile in ${SECSTACK_PROFILES}; do
            compose_args+=("--profile" "${profile}")
          done

          docker compose "${compose_args[@]}" config >/dev/null

          echo "Images required by Compose:"
          docker compose "${compose_args[@]}" config --images | sort -u

      - name: Start PRD stack
        run: |
          set -euo pipefail

          # Prefer the project start script if it exists.
          if [ -x "scripts/start-stack.sh" ] || [ -f "scripts/start-stack.sh" ]; then
            sh scripts/start-stack.sh
          else
            compose_args=("-f" "${COMPOSE_FILE}")
            for profile in ${SECSTACK_PROFILES}; do
              compose_args+=("--profile" "${profile}")
            done

            docker compose "${compose_args[@]}" up -d
          fi

      - name: Show PRD containers
        if: always()
        run: |
          docker ps -a || true
          docker compose -f "${COMPOSE_FILE}" ps || true
          docker system df || true

      - name: Cleanup downloaded artifacts and unused Docker resources
        if: always()
        run: |
          rm -rf "${IMAGE_ARTIFACT_ROOT}"

          docker container prune -f || true
          docker image prune -af || true
          docker volume prune -f || true
          docker builder prune -af || true
          docker system df || true

