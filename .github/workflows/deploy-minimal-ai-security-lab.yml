name: Deploy Minimal AI Security Lab

on:
  workflow_dispatch:
  push:
    branches: [v2.0]
    paths:
      - "deploy/minimal-ai-security-lab/**"
      - "suricata/**"
      - "scripts/install-suricata-home-security.sh"
      - ".github/workflows/deploy-minimal-ai-security-lab.yml"

permissions:
  contents: read

concurrency:
  group: home-security-lab-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/v2.0'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: deploy/minimal-ai-security-lab
    steps:
      - name: Checkout v2.0
        uses: actions/checkout@v4
        with:
          ref: v2.0
          clean: true
      - name: Check runtime prerequisites
        run: |
          set -euo pipefail
          command -v podman
          command -v podman-compose
          command -v curl
          podman info >/dev/null
          test -r /etc/home-security-lab/minimal-ai-security-lab.env
      - name: Ensure Suricata is installed with live application
        working-directory: .
        run: |
          set -euo pipefail
          if ! rpm -q suricata >/dev/null 2>&1; then
            echo "Suricata is not installed; attempting rpm-ostree live application."
            if ! sudo -n rpm-ostree install --apply-live suricata; then
              echo "ERROR: Live installation failed or is unsupported. No reboot attempted; install Suricata in a maintenance window and rerun." >&2
              exit 1
            fi
          fi
          rpm -q suricata >/dev/null
          command -v suricata >/dev/null
          systemctl cat suricata.service >/dev/null
      - name: Load host-managed environment
        run: install -m 600 /etc/home-security-lab/minimal-ai-security-lab.env .env
      - name: Validate Compose configuration
        run: podman-compose -f compose.yaml config >/dev/null
      - name: Pull container images
        run: |
          set -euo pipefail
          env_value() {
            local key="$1" fallback="$2" value
            value="$(sed -n "s/^\${key}=//p" .env | tail -n 1)"
            printf '%s' "${value:-$fallback}"
          }
          podman pull "wazuh/wazuh-manager:$(env_value WAZUH_VERSION 4.14.8)"
          podman pull "public.ecr.aws/zinclabs/openobserve:$(env_value OPENOBSERVE_TAG latest)"
          podman pull "ollama/ollama:$(env_value OLLAMA_TAG latest)"
          podman pull "cr.fluentbit.io/fluent/fluent-bit:$(env_value FLUENT_BIT_TAG 3.2)"
      - name: Build local AI worker
        run: podman-compose -f compose.yaml build security-ai
      - name: Install, validate, enable, and start host Suricata
        working-directory: .
        run: sudo -n bash deploy/minimal-ai-security-lab/scripts/install-suricata-home-security.sh
      - name: Deploy containers
        run: podman-compose -f compose.yaml up -d --build
      - name: Pull Ollama model
        run: |
          set -euo pipefail
          model="$(sed -n 's/^OLLAMA_MODEL=//p' .env | tail -n 1)"
          podman exec ollama ollama pull "${model:-qwen2.5:3b}"
      - name: Verify deployment
        run: |
          set -euo pipefail
          podman-compose -f compose.yaml ps
          systemctl is-active --quiet suricata
          sudo -n suricata -T -c /etc/suricata/suricata.yaml
          test -r /var/log/suricata/eve.json
          podman logs --tail 30 fluent-bit
          podman logs --tail 30 security-ai
          curl --fail --silent --show-error http://127.0.0.1:5080/healthz >/dev/null || echo "OpenObserve health check did not pass; inspect logs."
      - name: Remove temporary environment file
        if: always()
        run: rm -f .env
