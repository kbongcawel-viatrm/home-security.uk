name: Deploy Minimal AI Security Lab

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0
    paths:
      - "deploy/minimal-ai-security-lab/**"
      - "suricata/**"
      - "scripts/install-suricata-home-security.sh"

permissions:
  contents: read

concurrency:
  group: home-security-lab-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Register the Fedora host as a self-hosted Linux x64 runner.
    # Do not add untrusted repositories/branches to this runner.
    if: github.ref == 'refs/heads/v2.0'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: deploy/minimal-ai-security-lab

    steps:
      - name: Checkout v2.0
        uses: actions/checkout@v4
        with:
          ref: v2.0
          clean: true

      - name: Check host runtime and deployment environment
        run: |
          set -euo pipefail
          command -v podman
          command -v podman-compose
          command -v curl
          podman info >/dev/null
          test -r /etc/home-security-lab/minimal-ai-security-lab.env
          test -r /etc/suricata/suricata.yaml
          test -x /usr/bin/suricata || command -v suricata
          echo "Rootless Podman and host Suricata configuration found."

      - name: Prepare environment file
        run: |
          set -euo pipefail
          install -m 600 /etc/home-security-lab/minimal-ai-security-lab.env .env
          echo ".env copied from the host-managed secret file; it is not committed."

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          # Do not print rendered config: it contains credentials.
          podman-compose -f compose.yaml config >/dev/null

      - name: Pull application images to the Fedora runner
        run: |
          set -euo pipefail
          get_env() {
            local key="$1" default="$2" value
            value="$(sed -n "s/^\${key}=//p" .env | tail -n 1)"
            printf '%s' "${value:-$default}"
          }

          podman pull "wazuh/wazuh-manager:$(get_env WAZUH_VERSION 4.14.8)"
          podman pull "public.ecr.aws/zinclabs/openobserve:$(get_env OPENOBSERVE_TAG latest)"
          podman pull "ollama/ollama:$(get_env OLLAMA_TAG latest)"
          podman pull "cr.fluentbit.io/fluent/fluent-bit:$(get_env FLUENT_BIT_TAG 3.2)"

      - name: Install and validate native Suricata config and rules
        working-directory: .
        run: |
          set -euo pipefail
          sudo -n bash scripts/install-suricata-home-security.sh

      - name: Build local AI worker image
        run: |
          set -euo pipefail
          podman-compose -f compose.yaml build security-ai

      - name: Deploy containers
        run: |
          set -euo pipefail
          podman-compose -f compose.yaml up -d --build

      - name: Pull configured Ollama model
        run: |
          set -euo pipefail
          model="$(sed -n 's/^OLLAMA_MODEL=//p' .env | tail -n 1)"
          model="${model:-qwen2.5:3b}"
          podman exec ollama ollama pull "$model"

      - name: Verify deployment
        run: |
          set -euo pipefail
          podman-compose -f compose.yaml ps
          podman ps --format 'table {{.Names}}\t{{.Status}}'
          systemctl is-active --quiet suricata
          sudo -n suricata -T -c /etc/suricata/suricata.yaml
          test -r "$(sed -n 's/^SURICATA_LOG_DIR=//p' .env | tail -n 1 | sed 's#/$##')/eve.json" ||             test -r /var/log/suricata/eve.json
          curl --fail --silent --show-error http://127.0.0.1:5080/healthz >/dev/null ||             echo "OpenObserve health endpoint did not return success; inspect its container logs."
          podman logs --tail 30 fluent-bit
          podman logs --tail 30 security-ai

      - name: Remove workspace environment file
        if: always()
        run: |
          rm -f .env
