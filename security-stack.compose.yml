# security-stack.compose.yml
#
# Windows-focused security monitoring and incident-response lab stack.
#
# Usage:
#   cp .env.example .env
#   docker compose -f security-stack.compose.yml --profile brain config
#   docker compose -f security-stack.compose.yml --profile brain up -d
#   docker compose -f security-stack.compose.yml --profile network up -d
#   docker compose -f security-stack.compose.yml --profile ir up -d
#   docker compose -f security-stack.compose.yml --profile vuln up -d
#   docker compose -f security-stack.compose.yml --profile all up -d
#
# Linux host requirements:
#   sudo sysctl -w vm.max_map_count=262144
#
# This is a lab stack. Production Wazuh, Graylog, TheHive, Shuffle, and
# Greenbone deployments should use each vendor's full hardening guidance,
# certificate workflow, secret management, and backup design.

x-graylog-logging: &graylog-logging
  driver: gelf
  options:
    gelf-address: "udp://${GRAYLOG_GELF_ADDRESS:-127.0.0.1}:${GRAYLOG_GELF_UDP_PORT:-12201}"
    tag: "{{.Name}}"

services:
  ############################################################
  # Local DNS & FQDN routing
  ############################################################

  secdns:
    image: ${COREDNS_IMAGE:-docker.io/coredns/coredns:${COREDNS_VERSION:-1.11.3}}
    container_name: secdns
    profiles: ["dns", "all"]
    command: ["-conf", "/etc/coredns/Corefile"]
    ports:
      - "${SECDNS_HOST_IP:-127.0.0.1}:${SECDNS_PORT:-1053}:53/udp"
      - "${SECDNS_HOST_IP:-127.0.0.1}:${SECDNS_PORT:-1053}:53/tcp"
    volumes:
      - "./The Hands/CoreDNS/Corefile:/etc/coredns/Corefile:ro"
      - "./The Hands/CoreDNS/hosts.hq-sec:/etc/coredns/hosts.hq-sec:ro"
    networks:
      secnet:
        ipv4_address: "${SECDNS_IPV4:-10.77.0.53}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/coredns", "-version"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *graylog-logging

  fqdn-proxy:
    build:
      context: "./The Hands/FQDN proxy - Caddy"
      dockerfile: Dockerfile
    image: localhost/hq-sec/caddy-crowdsec
    container_name: fqdn-proxy
    profiles: ["dns", "all"]
    environment:
      CADDY_CROWDSEC_API_KEY: "${CADDY_CROWDSEC_API_KEY}"
    ports:
      - "${FQDN_HTTP_HOST_IP:-127.0.0.1}:${FQDN_HTTP_PORT:-8081}:80"
      - "${FQDN_HTTPS_HOST_IP:-127.0.0.1}:${FQDN_HTTPS_PORT:-8443}:443"
    volumes:
      - "./The Hands/FQDN proxy - Caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - fqdn-proxy-data:/data
      - fqdn-proxy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      secnet:
        ipv4_address: "${FQDN_PROXY_IPV4:-10.77.0.80}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *graylog-logging

  report-dashboard:
    image: ${CADDY_IMAGE:-docker.io/library/caddy:${CADDY_VERSION:-2.8.4-alpine}}
    container_name: report-dashboard
    profiles: ["ops", "dashboard", "all"]
    volumes:
      - "./The Hands/reports/dashboard-ui:/usr/share/caddy:ro"
      - "./The Hands/reports/data:/usr/share/caddy/reports:ro"
    networks:
      - secnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *graylog-logging

  ############################################################
  # The Ghost - LLM Governance (governs above all pillars)
  ############################################################

  ghost:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:${GHOST_VERSION:-0.20.7}}
    container_name: ghost
    profiles: ["ghost", "llm", "all"]
    volumes:
      - ghost-data:/root/.ollama
    networks:
      - secnet
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${GHOST_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *graylog-logging

  ghost-model-pull:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:${GHOST_VERSION:-0.20.7}}
    container_name: ghost-model-pull
    profiles: ["ghost", "llm", "all"]
    environment:
      OLLAMA_HOST: "${GHOST_LOCAL_API:-http://ghost:11434}"
      OLLAMA_MODELS: "${GHOST_MODELS_TO_PULL:-llama3.2}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 5
        done
        for model in $${OLLAMA_MODELS}; do
          echo "The Ghost is preparing model: $${model}"
          ollama pull "$${model}"
        done
    networks:
      - secnet
    restart: "no"
    depends_on:
      ghost:
        condition: service_healthy
    logging: *graylog-logging

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-docker.io/louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-1.23.16}}
    container_name: uptime-kuma
    profiles: ["ops", "monitor", "all"]
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - secnet
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${UPTIME_KUMA_PORT:-3002}:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *graylog-logging

  uptime-kuma-sync:
    image: ${PYTHON_IMAGE:-docker.io/library/python:${PYTHON_ALPINE_VERSION:-3.12-alpine}}
    container_name: uptime-kuma-sync
    profiles: ["ops", "monitor", "all"]
    environment:
      UPTIME_KUMA_URL: "${UPTIME_KUMA_URL:-http://uptime-kuma:3001}"
      UPTIME_KUMA_USERNAME: "${UPTIME_KUMA_USERNAME:-admin}"
      UPTIME_KUMA_PASSWORD: "${UPTIME_KUMA_PASSWORD:-}"
      UPTIME_KUMA_SYNC_INTERVAL_SECONDS: "${UPTIME_KUMA_SYNC_INTERVAL_SECONDS:-21600}"
      UPTIME_KUMA_SYNC_RUN_ON_STARTUP: "${UPTIME_KUMA_SYNC_RUN_ON_STARTUP:-true}"
    volumes:
      - "./The Eyes/Uptime-Kuma/monitors.yml:/uptime-kuma/monitors.yml:ro"
      - "./The Eyes/Uptime-Kuma/scripts:/uptime-kuma/scripts:ro"
    entrypoint: ["python", "/uptime-kuma/scripts/sync-monitors.py"]
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      uptime-kuma:
        condition: service_healthy
    logging: *graylog-logging

  container-health-exporter:
    image: ${PYTHON_IMAGE:-docker.io/library/python:${PYTHON_ALPINE_VERSION:-3.12-alpine}}
    container_name: container-health-exporter
    profiles: ["ops", "monitor", "all"]
    volumes:
      - "./The Eyes/Uptime-Kuma/scripts/container-health-exporter.py:/container-health-exporter.py:ro"
      - "${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    entrypoint: ["python", "/container-health-exporter.py"]
    networks:
      - secnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()\nPY"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *graylog-logging

  ############################################################
  # Management Tools
  ############################################################

  portainer:
    image: ${PORTAINER_CE_IMAGE:-docker.io/portainer/portainer-ce:${PORTAINER_VERSION:-latest}}
    container_name: portainer
    profiles: ["ops", "monitor", "all"]
    restart: unless-stopped
    volumes:
      - "${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"
      - portainer-data:/data
    networks:
      - secnet
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${PORTAINER_HTTP_PORT:-9002}:9000"
      - "${STACK_BIND_IP:-127.0.0.1}:${PORTAINER_HTTPS_PORT:-9443}:9443"
    logging: *graylog-logging

  log-forwarder:
    image: ${FLUENT_BIT_IMAGE:-docker.io/fluent/fluent-bit:${FLUENT_BIT_VERSION:-3.2.10}}
    container_name: log-forwarder
    profiles: ["ops", "logs", "all"]
    volumes:
      - "./The Eyes/Fluent Bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro"
      - "./The Eyes/Fluent Bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro"
      - fluent-bit-state:/fluent-bit/state
      - suricata-logs:/logs/suricata:ro
      - zeek-logs:/logs/zeek:ro
      - wazuh-manager-logs:/logs/wazuh-manager:ro
      - vault-logs:/logs/vault:ro
      - greenbone-openvas-log-data:/logs/openvas:ro
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      graylog:
        condition: service_healthy
    logging: *graylog-logging

  graylog-bootstrap:
    image: ${CURL_IMAGE:-docker.io/curlimages/curl:${CURL_VERSION:-8.10.1}}
    container_name: graylog-bootstrap
    profiles: ["ops", "logs", "all"]
    environment:
      GRAYLOG_API_URL: "${GRAYLOG_API_URL:-http://graylog:9000/api}"
      GRAYLOG_ROOT_USERNAME: "${GRAYLOG_ROOT_USERNAME:-admin}"
      GRAYLOG_ROOT_PASSWORD: "${GRAYLOG_ROOT_PASSWORD:-admin}"
      GRAYLOG_GELF_UDP_PORT: "${GRAYLOG_GELF_UDP_PORT:-12201}"
      GRAYLOG_SYSLOG_INPUT_PORT: "1514"
    volumes:
      - "./The Eyes/Graylog/scripts:/graylog/scripts:ro"
    entrypoint: ["/bin/sh", "/graylog/scripts/bootstrap-inputs.sh"]
    networks:
      - secnet
    restart: "no"
    depends_on:
      graylog:
        condition: service_healthy
    logging: *graylog-logging

  ghost-assessor:
    image: ${PYTHON_IMAGE:-docker.io/library/python:${PYTHON_ALPINE_VERSION:-3.12-alpine}}
    container_name: ghost-assessor
    profiles: ["ghost", "llm", "all"]
    environment:
      # The Ghost — Intelligence
      GHOST_MODEL: "${GHOST_MODEL:-gpt-4-turbo}"
      GHOST_MODELS_TO_PULL: "${GHOST_MODELS_TO_PULL:-llama3.2}"
      GHOST_CRON: "${GHOST_CRON:-0 2 * * *}"
      GHOST_RUN_ON_STARTUP: "${GHOST_RUN_ON_STARTUP:-true}"
      GHOST_MAX_LOG_LINES: "${GHOST_MAX_LOG_LINES:-2500}"
      GHOST_CONTEXT_CHARS: "${GHOST_CONTEXT_CHARS:-24000}"
      GHOST_LOCAL_API: "${GHOST_LOCAL_API:-http://ghost:11434}"
      # Brain — Graylog API
      GRAYLOG_API_URL: "${GRAYLOG_API_URL:-http://graylog:9000/api}"
      GRAYLOG_ROOT_USERNAME: "${GRAYLOG_ROOT_USERNAME:-admin}"
      GRAYLOG_ROOT_PASSWORD: "${GRAYLOG_ROOT_PASSWORD:-admin}"
      # Shield/Sword — CrowdSec LAPI
      CROWDSEC_LAPI_URL: "${CROWDSEC_LAPI_URL:-http://crowdsec:8080}"
      CROWDSEC_API_KEY: "${CROWDSEC_API_KEY:-}"
      # Hands — Uptime-Kuma reachability
      UPTIME_KUMA_URL: "${UPTIME_KUMA_URL:-http://uptime-kuma:3001}"
      # External Soul — OpenAI / ChatGPT
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - "./The Ghost/Core/scripts:/ghost/scripts:ro"
      - "./The Hands/reports/data:/reports"
      - "./The Hands/backups:/backups:ro"
      - "./The Hands/reports/data/container-vulnerabilities:/evidence/container-vulnerabilities:ro"
      # Eyes — network perception
      - suricata-logs:/logs/suricata:ro
      - zeek-logs:/logs/zeek:ro
      - caddy-logs:/logs/caddy:ro
      # Brain — SIEM logs
      - wazuh-manager-logs:/logs/wazuh-manager:ro
      # Shield — secrets, vuln, and block logs
      - vault-logs:/logs/vault:ro
      - greenbone-openvas-log-data:/logs/openvas:ro
      - crowdsec-data:/logs/crowdsec:ro
    entrypoint: ["python", "/ghost/scripts/analyze_stack.py"]
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      ghost-model-pull:
        condition: service_completed_successfully
      graylog:
        condition: service_healthy
    logging: *graylog-logging

  ############################################################
  # Secrets Management
  ############################################################

  vault:
    image: ${VAULT_IMAGE:-docker.io/hashicorp/vault:${VAULT_VERSION:-1.18}}
    container_name: vault
    profiles: ["secrets", "all"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    command: ["server", "-config=/vault/config/vault.hcl"]
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${VAULT_HTTP_PORT:-8200}:8200"
    volumes:
      - "./The Shield/vault/config:/vault/config:ro"
      - "./The Shield/vault/policies:/vault/policies:ro"
      - "./The Shield/vault/secrets:/vault/secrets:ro"
      - "./The Shield/vault/scripts:/vault/scripts:ro"
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    networks:
      - secnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *graylog-logging

  vault-rotator:
    image: ${VAULT_IMAGE:-docker.io/hashicorp/vault:${VAULT_VERSION:-1.18}}
    container_name: vault-rotator
    profiles: ["secrets", "all"]
    environment:
      VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
      VAULT_TOKEN: "${VAULT_ROTATOR_TOKEN:-}"
      VAULT_ROTATION_DAY: "${VAULT_ROTATION_DAY:-1}"
      VAULT_ROTATION_CHECK_SECONDS: "${VAULT_ROTATION_CHECK_SECONDS:-21600}"
      VAULT_ROTATION_RUN_ON_STARTUP: "${VAULT_ROTATION_RUN_ON_STARTUP:-false}"
      VAULT_KV_MOUNT: "${VAULT_KV_MOUNT:-secret}"
    volumes:
      - "./The Shield/vault/scripts:/vault/scripts:ro"
      - "./The Shield/vault/secrets:/vault/secrets:ro"
      - vault-rotator-state:/vault/state
    entrypoint: ["/bin/sh", "/vault/scripts/monthly-rotate.sh"]
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      - vault
    logging: *graylog-logging

  ############################################################
  # Backup & Vulnerability Observation
  ############################################################

  volume-backup:
    image: ${ALPINE_IMAGE:-docker.io/library/alpine:${BACKUP_ALPINE_VERSION:-3.20}}
    container_name: volume-backup
    profiles: ["ops", "backup", "all"]
    environment:
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_RUN_ON_STARTUP: "${BACKUP_RUN_ON_STARTUP:-true}"
    volumes:
      - "./The Hands/backup/scripts:/backup/scripts:ro"
      - "./The Hands/backups:/backups"
      - fqdn-proxy-data:/sources/fqdn-proxy-data:ro
      - fqdn-proxy-config:/sources/fqdn-proxy-config:ro
      - vault-data:/sources/vault-data:ro
      - vault-logs:/sources/vault-logs:ro
      - vault-rotator-state:/sources/vault-rotator-state:ro
      - ghost-data:/sources/ghost-data:ro
      - wazuh-indexer-data:/sources/wazuh-indexer-data:ro
      - wazuh-manager-data:/sources/wazuh-manager-data:ro
      - wazuh-manager-logs:/sources/wazuh-manager-logs:ro
      - wazuh-manager-queue:/sources/wazuh-manager-queue:ro
      - graylog-mongo-data:/sources/graylog-mongo-data:ro
      - graylog-datanode-data:/sources/graylog-datanode-data:ro
      - graylog-data:/sources/graylog-data:ro
      - suricata-logs:/sources/suricata-logs:ro
      - zeek-logs:/sources/zeek-logs:ro
      - thehive-data:/sources/thehive-data:ro
      - shuffle-data:/sources/shuffle-data:ro
      - shuffle-apps:/sources/shuffle-apps:ro
      - shuffle-files:/sources/shuffle-files:ro
      - velociraptor-data:/sources/velociraptor-data:ro
      - crowdsec-data:/sources/crowdsec-data:ro
      - crowdsec-config:/sources/crowdsec-config:ro
      - greenbone-gpg-data:/sources/greenbone-gpg-data:ro
      - greenbone-scap-data:/sources/greenbone-scap-data:ro
      - greenbone-cert-data:/sources/greenbone-cert-data:ro
      - greenbone-data-objects:/sources/greenbone-data-objects:ro
      - greenbone-gvmd-data:/sources/greenbone-gvmd-data:ro
      - greenbone-psql-data:/sources/greenbone-psql-data:ro
      - greenbone-vt-data:/sources/greenbone-vt-data:ro
      - greenbone-notus-data:/sources/greenbone-notus-data:ro
      - greenbone-openvas-data:/sources/greenbone-openvas-data:ro
      - greenbone-openvas-log-data:/sources/greenbone-openvas-log-data:ro
      - greenbone-gsa-data:/sources/greenbone-gsa-data:ro
      - greenbone-nginx-config:/sources/greenbone-nginx-config:ro
      - greenbone-nginx-certificates:/sources/greenbone-nginx-certificates:ro
      - uptime-kuma-data:/sources/uptime-kuma-data:ro
    entrypoint: ["/bin/sh", "/backup/scripts/backup-volumes.sh"]
    restart: unless-stopped
    logging: *graylog-logging

  container-vuln-scanner:
    image: ${TRIVY_IMAGE:-docker.io/aquasec/trivy:${TRIVY_VERSION:-0.70.0}}
    container_name: container-vuln-scanner
    profiles: ["ops", "scanner", "all"]
    environment:
      TRIVY_SCAN_INTERVAL_SECONDS: "${TRIVY_SCAN_INTERVAL_SECONDS:-86400}"
      TRIVY_SEVERITY: "${TRIVY_SEVERITY:-HIGH,CRITICAL}"
      TRIVY_EXIT_CODE: "${TRIVY_EXIT_CODE:-0}"
      TRIVY_RUN_ON_STARTUP: "${TRIVY_RUN_ON_STARTUP:-true}"
    volumes:
      - "./The Shield/scanner/scripts:/scanner/scripts:ro"
      - "./The Shield/scanner/targets.txt:/scanner/targets.txt:ro"
      - "./The Hands/reports/data/container-vulnerabilities:/reports"
      - trivy-cache:/root/.cache/trivy
    entrypoint: ["/bin/sh", "/scanner/scripts/scan-containers.sh"]
    restart: unless-stopped
    logging: *graylog-logging

  ############################################################
  # Visualization & SIEM - "Brain"
  ############################################################

  wazuh-indexer:
    image: ${WAZUH_INDEXER_IMAGE:-docker.io/wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.4}}
    container_name: wazuh-indexer
    profiles: ["brain", "all"]
    environment:
      OPENSEARCH_JAVA_OPTS: "${WAZUH_INDEXER_JAVA_OPTS:--Xms1g -Xmx1g}"
      bootstrap.memory_lock: "true"
      discovery.type: "single-node"
      network.host: "0.0.0.0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${WAZUH_INDEXER_PORT:-9200}:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - secnet
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  wazuh-manager:
    image: ${WAZUH_MANAGER_IMAGE:-docker.io/wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.4}}
    container_name: wazuh-manager
    hostname: wazuh-manager
    profiles: ["brain", "all"]
    environment:
      INDEXER_URL: "https://wazuh-indexer:9200"
      FILEBEAT_SSL_VERIFICATION_MODE: "${WAZUH_FILEBEAT_SSL_VERIFICATION_MODE:-none}"
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${WAZUH_EVENTS_PORT:-1514}:1514/udp"
      - "${STACK_BIND_IP:-127.0.0.1}:${WAZUH_FALLBACK_SYSLOG_PORT:-1516}:1516/udp"
      - "${STACK_BIND_IP:-127.0.0.1}:${WAZUH_ENROLLMENT_PORT:-1515}:1515"
      - "${STACK_BIND_IP:-127.0.0.1}:${WAZUH_API_PORT:-55000}:55000"
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      - "./The Brain/Wazuh/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro"
      - "./The Brain/Wazuh/decoders/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro"
    networks:
      - secnet
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:55000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  wazuh-dashboard:
    image: ${WAZUH_DASHBOARD_IMAGE:-docker.io/wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.4}}
    container_name: wazuh-dashboard
    profiles: ["brain", "all"]
    environment:
      INDEXER_URL: "https://wazuh-indexer:9200"
      WAZUH_API_URL: "https://wazuh-manager"
      DASHBOARD_USERNAME: "${WAZUH_DASHBOARD_USERNAME:-admin}"
      DASHBOARD_PASSWORD: "${WAZUH_DASHBOARD_PASSWORD:-SecretPassword}"
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${WAZUH_DASHBOARD_PORT:-5601}:5601"
    networks:
      - secnet
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:5601/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  graylog-mongo:
    image: ${MONGO_IMAGE:-docker.io/library/mongo:${MONGO_VERSION:-7.0.29}}
    container_name: graylog-mongo
    profiles: ["brain", "all"]
    volumes:
      - graylog-mongo-data:/data/db
    networks:
      - secnet
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *graylog-logging

  graylog-datanode:
    image: ${GRAYLOG_DATANODE_IMAGE:-docker.io/graylog/graylog-datanode:${GRAYLOG_VERSION:-7.0.6}}
    container_name: graylog-datanode
    profiles: ["brain", "all"]
    hostname: graylog-datanode
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: /var/lib/graylog-datanode/node-id
      GRAYLOG_DATANODE_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:-CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME}"
      GRAYLOG_DATANODE_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}"
      GRAYLOG_DATANODE_MONGODB_URI: "mongodb://graylog-mongo:27017/graylog"
      GRAYLOG_DATANODE_OPENSEARCH_HTTP_PORT: "9200"
      GRAYLOG_DATANODE_OPENSEARCH_TRANSPORT_PORT: "9300"
      OPENSEARCH_JAVA_OPTS: "${GRAYLOG_DATANODE_JAVA_OPTS:--Xms1g -Xmx1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - graylog-datanode-data:/var/lib/graylog-datanode
    networks:
      - secnet
    depends_on:
      graylog-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  graylog:
    image: ${GRAYLOG_IMAGE:-docker.io/graylog/graylog:${GRAYLOG_VERSION:-7.0.6}}
    container_name: graylog
    profiles: ["brain", "all"]
    hostname: graylog
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:-CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME}"
      GRAYLOG_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "${GRAYLOG_HTTP_EXTERNAL_URI:-http://localhost:9000/}"
      GRAYLOG_MONGODB_URI: "mongodb://graylog-mongo:27017/graylog"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://graylog-datanode:9200"
    entrypoint: ["/usr/bin/tini", "--", "/docker-entrypoint.sh"]
    depends_on:
      graylog-mongo:
        condition: service_healthy
      graylog-datanode:
        condition: service_healthy
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${GRAYLOG_HTTP_PORT:-9000}:9000"
      - "${STACK_BIND_IP:-127.0.0.1}:${GRAYLOG_GELF_UDP_PORT:-12201}:12201/udp"
      - "${STACK_BIND_IP:-127.0.0.1}:12202:12202/udp"
      - "${STACK_BIND_IP:-127.0.0.1}:12203:12203/udp"
      - "${STACK_BIND_IP:-127.0.0.1}:${GRAYLOG_SYSLOG_TCP_PORT:-5514}:1514/tcp"
      - "${STACK_BIND_IP:-127.0.0.1}:${GRAYLOG_SYSLOG_UDP_PORT:-5514}:1514/udp"
    volumes:
      - graylog-data:/usr/share/graylog/data
    networks:
      - secnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/lbstatus >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *graylog-logging

  ############################################################
  # Network Monitoring - "Eyes"
  ############################################################

  suricata:
    image: ${SURICATA_IMAGE:-docker.io/jasonish/suricata:${SURICATA_VERSION:-7.0}}
    container_name: suricata
    profiles: ["network", "all"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command:
      - "-c"
      - "/etc/suricata/suricata.yaml"
      - "-i"
      - "${SENSOR_INTERFACE:-eth0}"
      - "--set"
      - "outputs.eve-log.enabled=yes"
      - "--user"
      - "${SURICATA_RUN_USER:-suricata}"
      - "--group"
      - "${SURICATA_RUN_GROUP:-suricata}"
    volumes:
      - suricata-logs:/var/log/suricata
      - "./The Sword/Suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro"
      - "./The Sword/Suricata/rules:/var/lib/suricata/rules:ro"
    restart: unless-stopped
    logging: *graylog-logging

  suricata-rules-update:
    image: ${SURICATA_IMAGE:-docker.io/jasonish/suricata:${SURICATA_VERSION:-7.0}}
    container_name: suricata-rules-update
    profiles: ["network", "all"]
    environment:
      SURICATA_UPDATE_INTERVAL_SECONDS: "${SURICATA_UPDATE_INTERVAL_SECONDS:-86400}"
      SURICATA_UPDATE_RUN_ON_STARTUP: "${SURICATA_UPDATE_RUN_ON_STARTUP:-true}"
      SURICATA_UPDATE_ONCE: "${SURICATA_UPDATE_ONCE:-false}"
      SURICATA_UPDATE_ENABLE_SOURCES: "${SURICATA_UPDATE_ENABLE_SOURCES:-et/open oisf/trafficid ptresearch/attackdetection sslbl/ssl-fp-blacklist sslbl/ja3-fingerprints abuse.ch/sslbl-c2 abuse.ch/urlhaus}"
    entrypoint: ["/bin/sh", "/suricata-update/scripts/update-rules.sh"]
    volumes:
      - suricata-logs:/var/log/suricata
      - "./The Sword/Suricata/update:/suricata-update:ro"
      - "./The Sword/Suricata/rules:/local-rules:ro"
      - "./The Sword/Suricata/rules:/var/lib/suricata/rules"
    restart: unless-stopped
    logging: *graylog-logging

  zeek:
    image: ${ZEEK_IMAGE:-docker.io/zeek/zeek:${ZEEK_VERSION:-lts}}
    container_name: zeek
    profiles: ["network", "all"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["zeek", "-i", "${SENSOR_INTERFACE:-eth0}"]
    volumes:
      - zeek-logs:/usr/local/zeek/logs
    restart: unless-stopped
    logging: *graylog-logging

  ############################################################
  # Incident Response & Automation - "Shield"
  ############################################################

  thehive:
    image: ${THEHIVE_IMAGE:-docker.io/strangebee/thehive:${THEHIVE_VERSION:-5.7}}
    container_name: thehive
    profiles: ["ir", "all"]
    environment:
      JVM_OPTS: "${THEHIVE_JVM_OPTS:--Xms512m -Xmx1g}"
      THEHIVE_PLAY_SECRET: "${THEHIVE_PLAY_SECRET:-CHANGE_ME_THEHIVE_LAB_SECRET_KEY_CHANGE_ME}"
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${THEHIVE_HTTP_PORT:-9001}:9000"
    volumes:
      - thehive-data:/opt/thp/thehive/data
      - "./The Eyes/thehive/application.conf:/etc/thehive/application.conf:ro"
    networks:
      - secnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  shuffle-opensearch:
    image: ${OPENSEARCH_IMAGE:-docker.io/opensearchproject/opensearch:3.2.0}
    container_name: shuffle-opensearch
    profiles: ["ir", "all"]
    environment:
      OPENSEARCH_JAVA_OPTS: "${SHUFFLE_OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
      bootstrap.memory_lock: "true"
      cluster.name: "shuffle-cluster"
      node.name: "shuffle-opensearch"
      node.store.allow_mmap: "false"
      discovery.type: "single-node"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${SHUFFLE_OPENSEARCH_PASSWORD:-CHANGE_ME_SHUFFLE_OPENSEARCH_SECRET}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - shuffle-data:/usr/share/opensearch/data
    networks:
      - secnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  shuffle-backend:
    image: ${SHUFFLE_BACKEND_IMAGE:-ghcr.io/shuffle/shuffle-backend:${SHUFFLE_VERSION:-latest}}
    container_name: shuffle-backend
    profiles: ["ir", "all"]
    environment:
      SHUFFLE_APP_HOTLOAD_FOLDER: /shuffle-apps
      SHUFFLE_FILE_LOCATION: /shuffle-files
      SHUFFLE_OPENSEARCH_URL: "https://shuffle-opensearch:9200"
      SHUFFLE_OPENSEARCH_USERNAME: "admin"
      SHUFFLE_OPENSEARCH_PASSWORD: "${SHUFFLE_OPENSEARCH_PASSWORD:-CHANGE_ME_SHUFFLE_OPENSEARCH_SECRET}"
      SHUFFLE_OPENSEARCH_SKIPSSL_VERIFY: "true"
      SHUFFLE_APP_SECRET: "${SHUFFLE_APP_SECRET:-CHANGE_ME_SHUFFLE_LAB_SECRET}"
    volumes:
      - "${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - shuffle-apps:/shuffle-apps
      - shuffle-files:/shuffle-files
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      shuffle-opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *graylog-logging

  shuffle-frontend:
    image: ${SHUFFLE_FRONTEND_IMAGE:-ghcr.io/shuffle/shuffle-frontend:${SHUFFLE_VERSION:-latest}}
    container_name: shuffle-frontend
    profiles: ["ir", "all"]
    environment:
      BACKEND_HOSTNAME: "${SHUFFLE_BACKEND_HOSTNAME:-shuffle-backend}"
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${SHUFFLE_FRONTEND_PORT:-3001}:80"
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      shuffle-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *graylog-logging

  shuffle-orborus:
    image: ${SHUFFLE_ORBORUS_IMAGE:-ghcr.io/shuffle/shuffle-orborus:${SHUFFLE_VERSION:-latest}}
    container_name: shuffle-orborus
    profiles: ["ir", "all"]
    environment:
      SHUFFLE_APP_SDK_TIMEOUT: "300"
      ENVIRONMENT_NAME: "${SHUFFLE_ENVIRONMENT_NAME:-Shuffle}"
      ORG_ID: "${SHUFFLE_ORG_ID:-Shuffle}"
      BASE_URL: "http://${SHUFFLE_OUTER_HOSTNAME:-shuffle-backend}:5001"
      DOCKER_API_VERSION: "${SHUFFLE_DOCKER_API_VERSION:-1.40}"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      SHUFFLE_PASS_WORKER_PROXY: "${SHUFFLE_PASS_WORKER_PROXY:-TRUE}"
      SHUFFLE_PASS_APP_PROXY: "${SHUFFLE_PASS_APP_PROXY:-FALSE}"
      SHUFFLE_STATS_DISABLED: "true"
      SHUFFLE_LOGS_DISABLED: "true"
      SHUFFLE_SWARM_CONFIG: "run"
      CLEANUP: "false"
      SHUFFLE_WORKER_IMAGE: "ghcr.io/shuffle/shuffle-worker:${SHUFFLE_WORKER_VERSION:-nightly}"
    volumes:
      - "${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
    networks:
      - secnet
    restart: unless-stopped
    depends_on:
      shuffle-backend:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    logging: *graylog-logging

  velociraptor:
    image: ${VELOCIRAPTOR_IMAGE:-docker.io/xboarder56/velociraptor:${VELOCIRAPTOR_VERSION:-0.76.1}}
    container_name: velociraptor
    profiles: ["ir", "all"]
    environment:
      VELOCIRAPTOR_ADMIN_PASSWORD: "${VELOCIRAPTOR_ADMIN_PASSWORD:-admin}"
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${VELOCIRAPTOR_GUI_PORT:-8889}:8889"
      - "${STACK_BIND_IP:-127.0.0.1}:${VELOCIRAPTOR_FRONTEND_PORT:-8000}:8000"
    volumes:
      - velociraptor-data:/velociraptor
      - "./The Shield/velociraptor:/hq-sec-velociraptor:ro"
    networks:
      - secnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8889 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *graylog-logging

  crowdsec:
    image: ${CROWDSEC_IMAGE:-docker.io/crowdsecurity/crowdsec:${CROWDSEC_VERSION:-v1.6.3}}
    container_name: crowdsec
    profiles: ["ir", "all", "shield"]
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/windows crowdsecurity/suricata crowdsecurity/caddy"
      BOUNCER_KEY_caddy: "${CADDY_CROWDSEC_API_KEY}"
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${CROWDSEC_LAPI_PORT:-8080}:8080"
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - "./The Sword/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro"
      - "./The Sword/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro"
      - wazuh-manager-logs:/var/log/wazuh:ro
      - suricata-logs:/var/log/suricata:ro
      - caddy-logs:/var/log/caddy:ro
    networks:
      - secnet
    restart: unless-stopped
    logging: *graylog-logging

  ansible-ir:
    image: ${ANSIBLE_IMAGE:-docker.io/cytopia/ansible:${ANSIBLE_VERSION:-2.16-tools}}
    container_name: ansible-ir
    profiles: ["ir", "all"]
    user: "${SECSTACK_UID:-1000}:${SECSTACK_GID:-1000}"
    working_dir: /ansible
    environment:
      ANSIBLE_CONFIG: /ansible/ansible.cfg
      HOME: /ansible
    volumes:
      - "./The Sword/Ansible:/ansible"
      - "./The Sword/Ansible/.ssh:/ansible/.ssh:ro"
    entrypoint: ["sleep", "infinity"]
    networks:
      - secnet
    logging: *graylog-logging

  ############################################################
  # Vulnerability & Hardening
  ############################################################

  osquery:
    image: ${OSQUERY_IMAGE:-docker.io/osquery/osquery:${OSQUERY_VERSION:-5.8.2-ubuntu22.04}}
    container_name: osquery
    profiles: ["vuln", "all"]
    user: "${SECSTACK_UID:-1000}:${SECSTACK_GID:-1000}"
    command: ["osqueryi"]
    stdin_open: true
    tty: true
    volumes:
      - /:/host:ro
    networks:
      - secnet
    logging: *graylog-logging

  vulnerability-tests:
    image: ${VULNERABILITY_TESTS_IMAGE:-registry.community.greenbone.net/community/vulnerability-tests:${GREENBONE_DATA_TAG:-latest}}
    container_name: vulnerability-tests
    profiles: ["vuln", "all"]
    environment:
      FEED_RELEASE: "${GREENBONE_FEED_RELEASE:-24.10}"
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-vt-data:/mnt
    networks:
      - secnet
    logging: *graylog-logging

  notus-data:
    image: ${NOTUS_DATA_IMAGE:-registry.community.greenbone.net/community/notus-data:${GREENBONE_DATA_TAG:-latest}}
    container_name: notus-data
    profiles: ["vuln", "all"]
    environment:
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-notus-data:/mnt
    networks:
      - secnet
    logging: *graylog-logging

  scap-data:
    image: ${GREENBONE_SCAP_DATA_IMAGE:-${SCAP_DATA_IMAGE:-docker.io/vulnvision/greenbone-scap-data:latest}}
    container_name: scap-data
    profiles: ["vuln", "all"]
    environment:
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-scap-data:/mnt
    networks:
      - secnet
    logging: *graylog-logging

  cert-bund-data:
    image: ${CERT_BUND_DATA_IMAGE:-registry.community.greenbone.net/community/cert-bund-data:${GREENBONE_DATA_TAG:-latest}}
    container_name: cert-bund-data
    profiles: ["vuln", "all"]
    environment:
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-cert-data:/mnt
    networks:
      - secnet
    logging: *graylog-logging

  dfn-cert-data:
    image: ${DFN_CERT_DATA_IMAGE:-registry.community.greenbone.net/community/dfn-cert-data:${GREENBONE_DATA_TAG:-latest}}
    container_name: dfn-cert-data
    profiles: ["vuln", "all"]
    environment:
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-cert-data:/mnt
    networks:
      - secnet
    depends_on:
      cert-bund-data:
        condition: service_healthy
    logging: *graylog-logging

  data-objects:
    image: ${DATA_OBJECTS_IMAGE:-registry.community.greenbone.net/community/data-objects:${GREENBONE_DATA_TAG:-latest}}
    container_name: data-objects
    profiles: ["vuln", "all"]
    environment:
      FEED_RELEASE: "${GREENBONE_FEED_RELEASE:-24.10}"
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-data-objects:/mnt
    networks:
      - secnet
    logging: *graylog-logging

  report-formats:
    image: ${REPORT_FORMATS_IMAGE:-registry.community.greenbone.net/community/report-formats:${GREENBONE_DATA_TAG:-latest}}
    container_name: report-formats
    profiles: ["vuln", "all"]
    environment:
      FEED_RELEASE: "${GREENBONE_FEED_RELEASE:-24.10}"
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-data-objects:/mnt
    networks:
      - secnet
    depends_on:
      data-objects:
        condition: service_healthy
    logging: *graylog-logging

  gpg-data:
    image: ${GPG_DATA_IMAGE:-registry.community.greenbone.net/community/gpg-data:${GREENBONE_DATA_TAG:-latest}}
    container_name: gpg-data
    profiles: ["vuln", "all"]
    volumes:
      - greenbone-gpg-data:/mnt
    networks:
      - secnet
    logging: *graylog-logging

  redis-server:
    image: ${REDIS_SERVER_IMAGE:-docker.io/greenbone/redis-server:${GREENBONE_REDIS_TAG:-latest}}
    container_name: redis-server
    profiles: ["vuln", "all"]
    restart: unless-stopped
    volumes:
      - greenbone-redis-socket:/run/redis/
    networks:
      - secnet
    logging: *graylog-logging

  pg-gvm-migrator:
    image: ${PG_GVM_MIGRATOR_IMAGE:-registry.community.greenbone.net/community/pg-gvm-migrator:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: pg-gvm-migrator
    profiles: ["vuln", "all"]
    volumes:
      - greenbone-psql-data:/var/lib/postgresql
      - greenbone-psql-socket:/var/run/postgresql
    networks:
      - secnet
    logging: *graylog-logging

  pg-gvm:
    image: ${PG_GVM_IMAGE:-registry.community.greenbone.net/community/pg-gvm:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: pg-gvm
    profiles: ["vuln", "all"]
    restart: unless-stopped
    volumes:
      - greenbone-psql-data:/var/lib/postgresql
      - greenbone-psql-socket:/var/run/postgresql
    networks:
      - secnet
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully
    logging: *graylog-logging

  gvmd:
    image: ${GVMD_IMAGE:-registry.community.greenbone.net/community/gvmd:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: gvmd
    profiles: ["vuln", "all"]
    restart: unless-stopped
    environment:
      GREENBONE_ADMIN_USER: "${GREENBONE_ADMIN_USER:-admin}"
      GREENBONE_ADMIN_PASSWORD: "${GREENBONE_ADMIN_PASSWORD:-admin}"
    volumes:
      - greenbone-gvmd-data:/var/lib/gvm
      - greenbone-scap-data:/var/lib/gvm/scap-data/
      - greenbone-cert-data:/var/lib/gvm/cert-data
      - greenbone-data-objects:/var/lib/gvm/data-objects/gvmd
      - greenbone-vt-data:/var/lib/openvas/plugins
      - greenbone-psql-data:/var/lib/postgresql
      - greenbone-gvmd-socket:/run/gvmd
      - greenbone-ospd-openvas-socket:/run/ospd
      - greenbone-psql-socket:/var/run/postgresql
    networks:
      - secnet
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy
    logging: *graylog-logging

  gsa:
    image: ${GSA_IMAGE:-registry.community.greenbone.net/community/gsa:${GREENBONE_GSA_TAG:-stable-slim}}
    container_name: gsa
    profiles: ["vuln", "all"]
    environment:
      MOUNT_PATH: /mnt/web
      KEEP_ALIVE: "1"
    volumes:
      - greenbone-gsa-data:/mnt/web
    networks:
      - secnet
    healthcheck:
      test: ["CMD-SHELL", "test -e /run/gsa/copying.done"]
      start_period: 5s
    logging: *graylog-logging

  gsad:
    image: ${GSAD_IMAGE:-registry.community.greenbone.net/community/gsad:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: gsad
    profiles: ["vuln", "all"]
    restart: unless-stopped
    environment:
      GSAD_HTTP_ONLY: "true"
      GSAD_API_ONLY: "true"
      GSAD_FOREGROUND: "true"
    volumes:
      - greenbone-gvmd-socket:/run/gvmd
    networks:
      - secnet
    depends_on:
      gvmd:
        condition: service_started
    logging: *graylog-logging

  gvm-config:
    image: ${GVM_CONFIG_IMAGE:-registry.community.greenbone.net/community/gvm-config:${GREENBONE_CONFIG_TAG:-latest}}
    container_name: gvm-config
    profiles: ["vuln", "all"]
    environment:
      ENABLE_NGINX_CONFIG: "true"
      ENABLE_TLS_GENERATION: "true"
    volumes:
      - greenbone-nginx-config:/mnt/nginx/configs
      - greenbone-nginx-certificates:/mnt/nginx/certs
    networks:
      - secnet
    logging: *graylog-logging

  greenbone-nginx:
    image: ${NGINX_IMAGE:-registry.community.greenbone.net/community/nginx:${GREENBONE_CONFIG_TAG:-latest}}
    container_name: greenbone-nginx
    profiles: ["vuln", "all"]
    restart: unless-stopped
    ports:
      - "${STACK_BIND_IP:-127.0.0.1}:${GREENBONE_HTTPS_PORT:-9444}:443"
      - "${STACK_BIND_IP:-127.0.0.1}:${GREENBONE_GSA_PORT:-9392}:9392"
    volumes:
      - greenbone-nginx-config:/etc/nginx/conf.d:ro
      - greenbone-nginx-certificates:/etc/nginx/certs:ro
      - greenbone-gsa-data:/usr/share/nginx/html:ro
    networks:
      - secnet
    depends_on:
      gvm-config:
        condition: service_completed_successfully
      gsa:
        condition: service_healthy
      gsad:
        condition: service_started
    logging: *graylog-logging

  configure-openvas:
    image: ${OPENVAS_SCANNER_IMAGE:-registry.community.greenbone.net/community/openvas-scanner:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: configure-openvas
    profiles: ["vuln", "all"]
    volumes:
      - greenbone-openvas-data:/mnt
      - greenbone-openvas-log-data:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - secnet
    logging: *graylog-logging

  openvas:
    image: ${OPENVAS_SCANNER_IMAGE:-registry.community.greenbone.net/community/openvas-scanner:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: openvas
    profiles: ["vuln", "all"]
    volumes:
      - greenbone-openvas-data:/etc/openvas
      - greenbone-openvas-log-data:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    networks:
      - secnet
    depends_on:
      configure-openvas:
        condition: service_completed_successfully
    logging: *graylog-logging

  openvasd:
    image: ${OPENVAS_SCANNER_IMAGE:-registry.community.greenbone.net/community/openvas-scanner:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: openvasd
    profiles: ["vuln", "all"]
    restart: unless-stopped
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - greenbone-openvas-data:/etc/openvas
      - greenbone-openvas-log-data:/var/log/openvas
      - greenbone-gpg-data:/etc/openvas/gnupg
      - greenbone-notus-data:/var/lib/notus
    networks:
      secnet:
        aliases:
          - openvasd
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    logging: *graylog-logging

  ospd-openvas:
    image: ${OSPD_OPENVAS_IMAGE:-registry.community.greenbone.net/community/ospd-openvas:${GREENBONE_IMAGE_TAG:-stable}}
    container_name: ospd-openvas
    profiles: ["vuln", "all"]
    restart: unless-stopped
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - greenbone-gpg-data:/etc/openvas/gnupg
      - greenbone-vt-data:/var/lib/openvas/plugins
      - greenbone-notus-data:/var/lib/notus
      - greenbone-ospd-openvas-socket:/run/ospd
      - greenbone-redis-socket:/run/redis/
      - greenbone-openvas-data:/etc/openvas/
      - greenbone-openvas-log-data:/var/log/openvas
    networks:
      - secnet
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
    logging: *graylog-logging

  gvm-tools:
    image: ${GVM_TOOLS_IMAGE:-registry.community.greenbone.net/community/gvm-tools:${GREENBONE_IMAGE_TAG:-latest}}
    container_name: gvm-tools
    profiles: ["vuln", "all"]
    volumes:
      - greenbone-gvmd-socket:/run/gvmd
      - greenbone-ospd-openvas-socket:/run/ospd
    networks:
      - secnet
    depends_on:
      - gvmd
      - ospd-openvas
    logging: *graylog-logging

  nmap-scanner:
    build:
      context: "./The Eyes/nmap"
      dockerfile: Dockerfile
    image: localhost/hq-sec-stack-nmap-scanner
    container_name: nmap-scanner
    profiles: ["network", "all"]
    command: ["/usr/local/bin/scan.sh"]
    networks:
      - secnet
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${GRAYLOG_GELF_ADDRESS:-127.0.0.1}:12202"

  wireshark-scanner:
    build:
      context: "./The Eyes/wireshark"
      dockerfile: Dockerfile
    image: localhost/hq-sec-stack-wireshark-scanner
    container_name: wireshark-scanner
    profiles: ["network", "all"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    command: ["/usr/local/bin/capture.sh"]
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${GRAYLOG_GELF_ADDRESS:-127.0.0.1}:12203"

networks:
  secnet:
    driver: bridge
    ipam:
      config:
        - subnet: "${SECNET_CIDR:-10.77.0.0/24}"
          gateway: "${SECNET_GATEWAY:-10.77.0.1}"

