# Monitor set synchronized by simplified.compose.yml for the MVP profile.
defaults:
  interval: 60
  retry_interval: 60
  max_retries: 3

monitors:
  - name: MVP CoreDNS UDP
    type: port
    host: secdns
    port: 53
    endpoint: secdns:53/udp

  - name: MVP Caddy HTTP
    type: http
    url: http://caddy:80
    endpoint: http://caddy:80

  - name: MVP Wazuh Indexer
    type: http
    url: https://wazuh-indexer:9200
    endpoint: https://wazuh-indexer:9200
    ignore_tls: true

  - name: MVP Wazuh Manager Events
    type: port
    host: wazuh-manager
    port: 1514
    endpoint: wazuh-manager:1514/udp

  - name: MVP Wazuh Enrollment
    type: port
    host: wazuh-manager
    port: 1515
    endpoint: wazuh-manager:1515/tcp

  - name: MVP Wazuh Dashboard
    type: http
    url: https://wazuh-dashboard:5601/status
    endpoint: https://wazuh-dashboard:5601/status
    ignore_tls: true

  - name: MVP Graylog API
    type: http
    url: http://graylog:9000/api/system/lbstatus
    endpoint: http://graylog:9000/api/system/lbstatus

  - name: MVP Graylog GELF UDP
    type: port
    host: graylog
    port: 12201
    endpoint: graylog:12201/udp

  - name: MVP Fluent Bit Health
    type: http
    url: http://fluent-bit:2020/api/v1/health
    endpoint: http://fluent-bit:2020/api/v1/health

  - name: MVP Graylog Data Node
    type: http
    url: http://graylog-datanode:9200
    endpoint: http://graylog-datanode:9200

  - name: MVP MongoDB
    type: port
    host: mongodb
    port: 27017
    endpoint: mongodb:27017

  - name: MVP Uptime Kuma
    type: http
    url: http://uptime-kuma:3001
    endpoint: http://uptime-kuma:3001
