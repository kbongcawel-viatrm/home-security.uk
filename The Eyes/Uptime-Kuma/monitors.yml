# Desired Uptime Kuma monitors for hq-sec-stack.
#
# Keep this file synchronized with security-stack.compose.yml, The Hands/CoreDNS/hosts.hq-sec,
# The Hands/FQDN proxy - Caddy/Caddyfile, and README.md whenever services or endpoints change.

defaults:
  interval: 60
  retry_interval: 60
  max_retries: 3

monitors:
  - name: CoreDNS UDP
    type: port
    host: secdns
    port: 53
    category: Support Services
    endpoint: secdns:53/udp

  - name: CoreDNS Host UDP
    type: port
    host: 10.77.0.53
    port: 53
    category: Support Services
    endpoint: 10.77.0.53:53/udp

  - name: FQDN Proxy Health
    type: http
    url: http://fqdn-proxy/healthz
    category: Support Services
    fqdn: fqdn-proxy.hq-sec.local
    endpoint: http://fqdn-proxy/healthz

  - name: CoreDNS Container
    type: http
    url: http://container-health-exporter:8080/container/secdns
    category: Support Services
    endpoint: container:secdns

  - name: FQDN Proxy Container
    type: http
    url: http://container-health-exporter:8080/container/fqdn-proxy
    category: Support Services
    endpoint: container:fqdn-proxy

  - name: Reports Dashboard
    type: http
    url: http://reports.hq-sec.local
    category: Support Services
    fqdn: reports.hq-sec.local
    endpoint: http://caddy:80

  - name: Reports Dashboard Container
    type: http
    url: http://container-health-exporter:8080/container/caddy
    category: Support Services
    endpoint: container:caddy

  - name: Uptime Kuma
    type: http
    url: http://uptime.hq-sec.local
    category: Support Services
    fqdn: uptime.hq-sec.local
    endpoint: http://uptime-kuma:3001

  - name: Uptime Kuma Sync
    type: http
    url: http://container-health-exporter:8080/container/uptime-kuma-sync
    category: Support Services
    endpoint: container:uptime-kuma-sync

  - name: Ghost API
    type: http
    url: http://ghost.hq-sec.local/api/tags
    category: Support Services
    fqdn: ghost.hq-sec.local
    endpoint: http://ghost:11434/api/tags

  - name: Ghost Container
    type: http
    url: http://container-health-exporter:8080/container/ghost
    category: Support Services
    endpoint: container:ghost

  - name: Ghost Model Pull Completed
    type: http
    url: http://container-health-exporter:8080/container/ghost-model-pull?mode=completed
    category: Support Services
    endpoint: container:ghost-model-pull

  - name: Vault Health
    type: http
    url: http://vault.hq-sec.local/v1/sys/health
    category: Support Services
    fqdn: vault.hq-sec.local
    endpoint: http://vault:8200/v1/sys/health
    accepted_statuscodes:
      - 200-299
      - 429
      - 472
      - 473
      - 501
      - 503

  - name: Vault Rotator
    type: http
    url: http://container-health-exporter:8080/container/vault-rotator
    category: Support Services
    endpoint: container:vault-rotator

  - name: Wazuh Dashboard
    type: http
    url: https://wazuh.hq-sec.local
    category: Visualization & SIEM
    fqdn: wazuh.hq-sec.local
    endpoint: https://wazuh-dashboard:5601
    ignore_tls: true

  - name: Wazuh Dashboard Container
    type: http
    url: http://container-health-exporter:8080/container/wazuh-dashboard
