# MVP Uptime Kuma monitors for simplified.compose.yml and the
# home-security.local namespace.
# HTTP checks validate DNS, Caddy, TLS, and the target service together.

defaults:
  interval: 60
  retry_interval: 30
  max_retries: 3

monitors:
  - name: Caddy health
    type: http
    url: https://caddy.home-security.local/healthz
    category: Support Services
    fqdn: caddy.home-security.local
    endpoint: https://caddy.home-security.local/healthz
    ignore_tls: true

  - name: CoreDNS UDP
    type: port
    host: secdns
    port: 53
    category: Support Services
    endpoint: secdns:53/udp

  - name: Uptime Kuma
    type: http
    url: https://uptimekuma.home-security.local/
    category: Support Services
    fqdn: uptimekuma.home-security.local
    endpoint: https://uptimekuma.home-security.local/
    ignore_tls: true

  - name: Graylog web/API
    type: http
    url: https://graylog.home-security.local/api/system/lbstatus
    category: Visualization & SIEM
    fqdn: graylog.home-security.local
    endpoint: https://graylog.home-security.local/api/system/lbstatus
    ignore_tls: true

  - name: Graylog GELF UDP
    type: port
    host: graylog
    port: 12201
    category: Visualization & SIEM
    endpoint: graylog:12201/udp

  - name: Graylog syslog TCP
    type: port
    host: graylog
    port: 1514
    category: Visualization & SIEM
    endpoint: graylog:1514/tcp

  - name: Graylog MongoDB
    type: port
    host: graylog-mongo
    port: 27017
    category: Visualization & SIEM
    endpoint: graylog-mongo:27017/tcp

  - name: Graylog Data Node
    type: port
    host: graylog-datanode
    port: 9200
    category: Visualization & SIEM
    endpoint: graylog-datanode:9200/tcp

  - name: Wazuh dashboard
    type: http
    url: https://wazuh.home-security.local/status
    category: Visualization & SIEM
    fqdn: wazuh.home-security.local
    endpoint: https://wazuh.home-security.local/status
    ignore_tls: true
    accepted_statuscodes:
      - 200-299
      - 401
      - 403

  - name: Wazuh manager API
    type: http
    url: https://wazuh-api.home-security.local/
    category: Visualization & SIEM
    fqdn: wazuh-api.home-security.local
    endpoint: https://wazuh-api.home-security.local/
    ignore_tls: true
    accepted_statuscodes:
      - 200-299
      - 401
      - 403

  - name: Wazuh indexer
    type: http
    url: https://wazuh-indexer.home-security.local/
    category: Visualization & SIEM
    fqdn: wazuh-indexer.home-security.local
    endpoint: https://wazuh-indexer.home-security.local/
    ignore_tls: true
    accepted_statuscodes:
      - 200-299
      - 401
      - 403

  - name: Wazuh agent events UDP
    type: port
    host: wazuh-manager
    port: 1514
    category: Visualization & SIEM
    endpoint: wazuh-manager:1514/udp

  - name: Wazuh enrollment TCP
    type: port
    host: wazuh-manager
    port: 1515
    category: Visualization & SIEM
    endpoint: wazuh-manager:1515/tcp